name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Concurrency Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Unit & Race Detector Tests
        run: go test -v -race -timeout 2m ./tests/...

      - name: Build Binary
        run: go build -v -o bin/tenantgate ./cmd/server
